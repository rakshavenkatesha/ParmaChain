# Foundry configuration for property-based (fuzz / invariant) testing of the PharmaChain contracts.
# Runs in Docker (no local install):
#   docker run --rm -v "<abs path>/blockchain:/work" -w /work --entrypoint forge ghcr.io/foundry-rs/foundry:latest test
# Hardhat remains the main build/test tool; Foundry reuses its node_modules.

[profile.default]
src = "contracts"
test = "forge-test"
out = "forge-out"
cache_path = "forge-cache"
libs = ["node_modules"]
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@prb/math/=node_modules/@prb/math/"
]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000
seed = "0x2026"

[invariant]
runs = 128
depth = 64
fail_on_revert = false
